<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Walkthroughs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 60px;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container,
    .feedback-wrap {
      width: 306px;
      max-width: 100%;
      text-align: center;
    }

    .container {
      margin: 0 auto;
    }

    .logo {
      margin-bottom: 24px;
    }

    .logo img {
      max-width: 96px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 30px;
      color: #ffffff;
    }

    p {
      margin: 0 0 24px 0;
      color: #e5e5e5;
      font-size: 17px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 18px;
      margin: 0 0 14px 0;
      border-radius: 999px;
      border: none;
      background: #e50914;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.05em;
      box-sizing: border-box;
    }

    .btn:hover {
      background: #f6121d;
    }

    .feedback-wrap {
      margin-top: auto;
      padding-top: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="logo.png" alt="Walkthrough logo" />
    </div>

    <h1>Walkthroughs</h1>
    <p>Select your building to start.</p>

    <a class="btn" href="https://airtable.com/appzr4HJlF8nTkelK/pagnVI1oBBlyUMY2t/form?prefill_Building=ICON" target="_blank" rel="noopener">
      NOV North
    </a>

    <a class="btn" href="https://airtable.com/appzr4HJlF8nTkelK/pagTQY4h48PIoYQl0/form?prefill_Building=CUE" target="_blank" rel="noopener">
      NOV South
    </a>

    <a class="btn" href="https://airtable.com/appzr4HJlF8nTkelK/pagZnvuWjnluYKO3B/form?prefill_Building=BOC" target="_blank" rel="noopener">
      NOV Studios
    </a>

    <a class="btn" href="https://airtable.com/appzr4HJlF8nTkelK/pagnafawXcDiTTg6a/form?prefill_Building=BOC" target="_blank" rel="noopener">
      Tudum Theatre
    </a>

    <a class="btn" href="https://airtable.com/appzr4HJlF8nTkelK/pagAsmxvBEXeVIeTZ/form?prefill_Building=BOC" target="_blank" rel="noopener">
      NOV Bungalow
    </a>
  </div>

  <div class="feedback-wrap">
    <a class="btn" href="https://airtable.com/appzr4HJlF8nTkelK/pagSQ7mJ8iHBdvR0W/form" target="_blank" rel="noopener">
      Feedback Form
    </a>
  </div>
</body>
</html>
